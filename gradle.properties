minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.18.4

# Fabric API — usar el build más reciente publicado para 1.21.1
fabric_version=0.116.7+1.21.1

mod_version=0.1.0-alpha
maven_group=com.modamod
archives_base_name=modamod

# Gradle (2026-10-22, "aplicá los ajustes de Gradle"): con los 512 MB por defecto Loom se arrastraba y, con poca RAM
# libre, el daemon se cerraba solo y el siguiente build arrancaba de cero (11 min). El daemon se cierra a los 10 min
# sin uso en vez de quedar 3 h ocupando memoria.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon.idletimeout=600000
